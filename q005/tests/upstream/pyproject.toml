[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-bench-public"
version = "0.1.0"
description = "Public GTM benchmark runner and LLM-as-judge scaffold."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.scripts]
gtm-bench-public = "gtm_bench_public.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gtm_bench_public = ["py.typed"]
